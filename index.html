<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Generator — Steven19's Tools</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href=#>Steven19's Tools</a>
      <nav class="tabs">
      <a href="index.html" class="active">QR Generator</a>
      <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="wrap content">
    <h1>QR Code Generator</h1>
    <p>Enter text, a link, or a phone number — a black-and-white QR code is generated right in your browser, no server needed.</p>

    <div class="qr-tool">
      <label for="qr-text">Content</label>
      <textarea id="qr-text" placeholder="https://example.com&#10;&#10;Paste a link, text, or phone number here"></textarea>

      <div class="qr-row">
        <select id="qr-size">
          <option value="200">Small · 200px</option>
          <option value="300" selected>Medium · 300px</option>
          <option value="500">Large · 500px</option>
        </select>
        <button id="qr-gen-btn" type="button">Generate QR code</button>
      </div>
      <div class="qr-error" id="qr-error" style="display:none;">Please enter some content first.</div>

      <div class="qr-result" id="qr-result" style="display:none;">
        <div id="qr-box"></div>
        <button id="qr-dl-btn" type="button" class="btn-secondary">Download PNG</button>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
    (function(){
      var textEl = document.getElementById('qr-text');
      var sizeEl = document.getElementById('qr-size');
      var genBtn = document.getElementById('qr-gen-btn');
      var dlBtn = document.getElementById('qr-dl-btn');
      var resultEl = document.getElementById('qr-result');
      var qrbox = document.getElementById('qr-box');
      var errEl = document.getElementById('qr-error');

      function generate(){
        var value = textEl.value.trim();
        if(!value){
          errEl.style.display = 'block';
          resultEl.style.display = 'none';
          return;
        }
        errEl.style.display = 'none';
        qrbox.innerHTML = '';
        var size = parseInt(sizeEl.value, 10);
        new QRCode(qrbox, {
          text: value,
          width: size,
          height: size,
          colorDark: '#000000',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });
        resultEl.style.display = 'block';
      }

      genBtn.addEventListener('click', generate);

      dlBtn.addEventListener('click', function(){
        var canvas = qrbox.querySelector('canvas');
        var img = qrbox.querySelector('img');
        var dataUrl = null;
        try{
          if(canvas){ dataUrl = canvas.toDataURL('image/png'); }
          else if(img){ dataUrl = img.src; }
        }catch(e){ dataUrl = null; }
        if(!dataUrl) return;
        var a = document.createElement('a');
        a.href = dataUrl;
        a.download = 'qr-code.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      });
    })();
    </script>
  </main>

  <footer class="site-footer">
    <div class="wrap">© 2026 — Steven19's Tools</div>
  </footer>
</body>
</html>
